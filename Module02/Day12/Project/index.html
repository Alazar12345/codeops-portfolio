<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habesha Eatery - Reservations</title>
    <meta name="description" content="Reserve a table at Habesha Eatery in Bole, Addis Ababa.">
</head>
<body>

<header>
    <h1>Habesha Eatery</h1>

    <nav>
        <a href="index.html">Reservations</a> |
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>

    <section>
        <h2>Reserve a Table</h2>

        <form action="/reserve" method="post">

            <label for="fullname">Full Name</label><br>
            <input
                type="text"
                id="fullname"
                name="fullname"
                required
            ><br><br>

            <label for="email">Email</label><br>
            <input
                type="email"
                id="email"
                name="email"
                required
            ><br><br>

            <label for="date">Reservation Date</label><br>
            <input
                type="date"
                id="date"
                name="date"
                required
            ><br><br>

            <label for="time">Time</label><br>
            <input
                type="time"
                id="time"
                name="time"
                required
            ><br><br>

            <label for="guests">Number of Guests</label><br>
            <input
                type="number"
                id="guests"
                name="guests"
                min="1"
                max="20"
                required
            ><br><br>

            <button type="submit">Reserve</button>

        </form>
    </section>

    <section>

        <h2>Menu (ETB)</h2>

        <table border="1">
            <caption>Popular Menu Items</caption>

            <thead>
                <tr>
                    <th>Food</th>
                    <th>Price (ETB)</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Doro Wat</td>
                    <td>350</td>
                </tr>

                <tr>
                    <td>Tibs</td>
                    <td>320</td>
                </tr>

                <tr>
                    <td>Shiro</td>
                    <td>180</td>
                </tr>

                <tr>
                    <td>Firfir</td>
                    <td>170</td>
                </tr>

                <tr>
                    <td>Injera with Beyaynetu</td>
                    <td>250</td>
                </tr>
            </tbody>

        </table>

    </section>

    <section>

        <h2>Restaurant Media</h2>

        <figure>

            <img
                src="restaurant.jpg"
                alt="Dining area inside Habesha Eatery"
                width="500"
            >

            <figcaption>
                Enjoy authentic Ethiopian cuisine in a welcoming atmosphere.
            </figcaption>

        </figure>

    </section>

</main>

<footer>

    <p>Bole, Addis Ababa</p>

</footer>

</body>
</html>
